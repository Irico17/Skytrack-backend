# =============================================
# Tasf.B2B Scheduling Backend — Configuration
# =============================================

server.port=8080

# --- BASE DE DATOS ---
# MySQL (producción)
spring.datasource.url=jdbc:mysql://localhost:3306/scheduling_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Si no tienes MySQL instalado, comenta las 3 líneas de arriba
# y descomenta las siguientes (H2 embebido, sin instalación):
# spring.datasource.url=jdbc:h2:mem:scheduling;DB_CLOSE_DELAY=-1
# spring.datasource.driver-class-name=org.h2.Driver
# spring.h2.console.enabled=true

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- RUTAS A ARCHIVOS DE DATOS ---
# Ajustar según dónde estén los archivos
data.airports.path=data/c.1inf54.26.1.v1.Aeropuerto.husos.v1.20250818__estudiantes.txt
data.flights.path=data/planes_vuelo.txt
data.shipments.dir=data/_envios_preliminar_

# --- LOGGING ---
logging.level.com.equipo2b=INFO
logging.level.org.springframework.web.socket=DEBUG
