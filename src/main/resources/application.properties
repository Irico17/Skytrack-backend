# =============================================
# Tasf.B2B Scheduling Backend - Base Configuration
# =============================================

spring.profiles.default=dev

server.port=${SERVER_PORT:8080}

# Compresión HTTP: acelera el arranque del frontend (payload /api/data/flights ~15k vuelos).
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain,text/css,application/javascript
server.compression.min-response-size=2048

# Límites de carga: el dataset real de envíos (~340 MB en 30 archivos) debe entrar en una
# sola petición multipart. file-size-threshold bajo fuerza el volcado a disco (no a RAM)
# en la VM de 2 GB, evitando picos de memoria.
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_FILE_SIZE:512MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_REQUEST_SIZE:512MB}
spring.servlet.multipart.file-size-threshold=${MAX_UPLOAD_MEMORY_THRESHOLD:1MB}

# --- RUTAS A ARCHIVOS DE DATOS ---
data.airports.path=${DATA_AIRPORTS_PATH:data/c.1inf54.26.1.v1.Aeropuerto.husos.v1.20250818__estudiantes.txt}
data.flights.path=${DATA_FLIGHTS_PATH:data/planes_vuelo.txt}
data.shipments.dir=${DATA_SHIPMENTS_DIR:data/_envios_preliminar_}
data.results.dir=${DATA_RESULTS_DIR:data/results}

# --- JPA ---
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# --- HEALTH ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# --- LOGGING ---
logging.level.com.equipo2b=${LOGGING_LEVEL_COM_EQUIPO2B:INFO}
logging.level.org.springframework.web.socket=${LOGGING_LEVEL_SPRING_WEB_SOCKET:INFO}
