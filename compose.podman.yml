services:
  mysql:
    image: mysql:8.0
    container_name: scheduling-mysql
    restart: unless-stopped
    command:
      - --innodb-buffer-pool-size=128M
      - --max-connections=25
      - --performance-schema=OFF
      - --skip-log-bin
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-scheduling_db}
      MYSQL_USER: ${MYSQL_USER:-scheduling_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-scheduling_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 384m
    cpus: 0.15
    networks:
      - scheduling

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: scheduling-core:local
    container_name: scheduling-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: container
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-scheduling_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-scheduling_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-scheduling_password}
      DATA_AIRPORTS_PATH: /app/data/c.1inf54.26.1.v1.Aeropuerto.husos.v1.20250818__estudiantes.txt
      DATA_FLIGHTS_PATH: /app/data/planes_vuelo.txt
      DATA_SHIPMENTS_DIR: /app/data/_envios_preliminar_
      DATA_RESULTS_DIR: /app/data/results
      LOGGING_LEVEL_COM_EQUIPO2B: INFO
      LOGGING_LEVEL_SPRING_WEB_SOCKET: INFO
      # Xmx768m: pico de heap medido ~350 MB (2028, ciclo 1 con Tabú dinámico) → 2×
      # de margen. Con Xmx1024 el RSS real (heap+metaspace+threads) rozaba el límite
      # del contenedor y en la VM de 2 GB (donde los límites sumaban 2048m sin dejar
      # nada al SO) el kernel OOM-mataba a java a mitad del ciclo 1 → el backend
      # reiniciaba vacío y el frontend recibía 404 en /status para siempre.
      JAVA_TOOL_OPTIONS: >-
        -Xms192m -Xmx768m
        -XX:MaxMetaspaceSize=160m
        -XX:+UseG1GC
        -XX:ActiveProcessorCount=2
        -XX:ParallelGCThreads=2
        -XX:ConcGCThreads=1
        -Djava.util.concurrent.ForkJoinPool.common.parallelism=1
        -Dfile.encoding=UTF-8
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./data/c.1inf54.26.1.v1.Aeropuerto.husos.v1.20250818__estudiantes.txt:/app/data/c.1inf54.26.1.v1.Aeropuerto.husos.v1.20250818__estudiantes.txt:ro
      - ./data/planes_vuelo.txt:/app/data/planes_vuelo.txt:ro
      - ./data/_envios_preliminar_:/app/data/_envios_preliminar_:ro
      - ./data/results:/app/data/results:rw
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    # 1152m > RSS máximo esperado (~1000m con Xmx768+metaspace160+threads). La suma de
    # límites (384+1152+128 = 1664m) deja ~380m para SO+podman en la VM de 2 GB.
    mem_limit: 1152m
    cpus: 1.6
    networks:
      - scheduling

  frontend:
    build:
      context: ../Skytrack-Frontend
      dockerfile: Dockerfile
    image: skytrack-frontend:local
    container_name: scheduling-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 15s
    mem_limit: 128m
    cpus: 0.05
    networks:
      - scheduling

volumes:
  mysql-data:

networks:
  scheduling:
    driver: bridge
