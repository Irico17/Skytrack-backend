server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 1inf54-981-2b.inf.pucp.edu.pe 200.16.7.142 _;

    root /var/www/skytrack;
    index index.html;
    # El dataset completo de envios (~390 MB en 30 archivos) sube en UNA peticion multipart.
    # 128m provocaba "413 Request Entity Too Large" antes de llegar al backend (que acepta 512MB).
    client_max_body_size 512m;
    # client_body_timeout por defecto es 60s (tiempo máximo ENTRE paquetes del body que llegan
    # del cliente) — con 390 MB desde el navegador a una VM remota, en una conexión normal se
    # supera fácil, y nginx corta la conexión a mitad de subida. Eso el navegador lo reporta
    # como ERR_CONNECTION_RESET (no como 413, porque nunca llega a completarse el body).
    client_body_timeout 1800s;

    location /api/ {
        proxy_pass http://127.0.0.1:8081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8081/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
